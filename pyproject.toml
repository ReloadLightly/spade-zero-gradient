[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szg"
version = "0.1.0"
description = "spade-zero-gradient: can SPADE's Environment Designer improve without weight updates? (in-context memory + evolved design strategies, hint-based regret fitness)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["szg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
